# configuration to setup readthedocs
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
sphinx:
  configuration: docs/source/conf.py
#formats: all
formats:
  - htmlzip
python:
  install:
    - requirements: requirements-sys.txt
    - requirements: requirements-doc.txt
    - requirements: requirements-transform.txt
