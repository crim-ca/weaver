# look for secrets pushed by mistake

# NOTE: To fix problematic commits that got references to detected secrets, execute the following:
# 1. Assuming the branch is built on top of master for a PR
#     >> git rebase -i master
# 2. Then, replace "pick" by "squash" for matched problematic commits
#	 If this didn't work, more advanced edit of history commits needs to be applied.
#	 Please refer to git interactive rebase documentation to do so.
# 3. Finally re-run secrets analysis to validate that problems where fixed

name: Secret Scan
on:
  # WARNING:
  #   'pull_request_target' is used so that PRs from forks can access GITLEAKS_LICENSE.
  #   It is safe only because no PR code is executed. The PR is checked out for git history scanning only,
  #   and the gitleaks configuration is always taken from the base branch, never from the PR.
  #   Do not add any step that builds, installs or runs code from the checked out PR.
  pull_request_target:
  push:

permissions:
  contents: read
  pull-requests: read

# cancel the current workflow if another commit was pushed on the same PR or reference
# uses the GitHub workflow name to avoid collision with other workflows running on the same PR/reference
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # ref: https://github.com/svdarren/secrets-workflow/blob/9633bc1195a1ca1d4d70415aa4eff6cf55d706de/.github/workflows/secrets.yml
  gitleak:
    name: gitleaks
    runs-on: ubuntu-latest
    # Skip for Dependabot PRs - they can't access GITLEAKS_LICENSE secret
    # and only modify dependency versions (no risk of leaking secrets)
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: '0'
          persist-credentials: false
      # trusted configuration from the base branch, ignoring any modification from the PR
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted-config
          sparse-checkout: .github/.gitleaks.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # a PR could add an ignore file to hide its own findings, none is defined by this repository
      - name: Remove untrusted ignore file
        run: rm -f .gitleaksignore
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.trusted-config/.github/.gitleaks.toml
