# look for secrets pushed by mistake

# NOTE: To fix problematic commits that got references to detected secrets, execute the following:
# 1. Assuming the branch is built on top of master for a PR
#     >> git rebase -i master
# 2. Then, replace "pick" by "squash" for matched problematic commits
#	 If this didn't work, more advanced edit of history commits needs to be applied.
#	 Please refer to git interactive rebase documentation to do so.
# 3. Finally re-run secrets analysis to validate that problems where fixed

name: Secret Scan
on:
  # PR code is scanned but never executed. Gitleaks config is checked out from the base branch.
  # Keep this workflow free of steps that build, install, or run files from the PR checkout.
  pull_request_target:
  push:

permissions:
  contents: read
  pull-requests: read

# cancel the current workflow if another commit was pushed on the same PR or reference
# uses the GitHub workflow name to avoid collision with other workflows running on the same PR/reference
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # ref: https://github.com/svdarren/secrets-workflow/blob/9633bc1195a1ca1d4d70415aa4eff6cf55d706de/.github/workflows/secrets.yml
  gitleak:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.24.3"  # shared by the action and manual CLI invocation

    # Skip for Dependabot PRs - they can't access GITLEAKS_LICENSE secret
    # and only modify dependency versions (no risk of leaking secrets)
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: '0'
          persist-credentials: false
      # trusted configuration from the base branch, ignoring any modification from the PR
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted-config
          sparse-checkout: .github/.gitleaks.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # a PR could add an ignore file to hide its own findings, none is defined by this repository
      - name: Remove untrusted ignore file
        run: rm -f .gitleaksignore
      # Use the CLI for PRs so fork scans do not require repository secrets.
      # Cannot employ 'gitleaks/gitleaks-action' because it does not support 'pull_request_target'.
      # The action works with 'pull_request', but breaks on forks that do not have the 'secrets' object populated.
      # (see https://github.com/gitleaks/gitleaks-action/issues/94, https://github.com/gitleaks/gitleaks-action/issues/201)
      - name: Install Gitleaks CLI
        if: github.event_name == 'pull_request_target'
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/zricethezav/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan pull request commits with Gitleaks CLI
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPOSITORY: ${{ github.repository }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.trusted-config/.github/.gitleaks.toml
        run: |
          git fetch --no-tags "https://github.com/${BASE_REPOSITORY}.git" "$BASE_SHA"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          gitleaks detect \
            --source . \
            --config "$GITLEAKS_CONFIG" \
            --redact \
            --exit-code 2 \
            --log-opts="--no-merges --first-parent ${merge_base}..${HEAD_SHA}"
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.trusted-config/.github/.gitleaks.toml
