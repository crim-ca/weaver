# look for secrets pushed by mistake

# NOTE: To fix problematic commits that got references to detected secrets, execute the following:
# 1. Assuming the branch is built on top of master for a PR
#     >> git rebase -i master
# 2. Then, replace "pick" by "squash" for matched problematic commits
#	 If this didn't work, more advanced edit of history commits needs to be applied.
#	 Please refer to git interactive rebase documentation to do so.
# 3. Finally re-run secrets analysis to validate that problems where fixed

name: Secret Scan
on:
  # Scanning only. PR code is never executed, and no secrets are required.
  pull_request:
  push:

permissions:
  contents: read

# cancel the current workflow if another commit was pushed on the same PR or reference
# uses the GitHub workflow name to avoid collision with other workflows running on the same PR/reference
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    env:
      BETTERLEAKS_CONFIG: ${{ github.workspace }}/.trusted-config/.github/.gitleaks.toml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: '0'
          persist-credentials: false
      # trusted configuration from the base branch, ignoring any modification from the PR
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted-config
          sparse-checkout: .github/.gitleaks.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Scan repository history
        run: make check-security-secrets
