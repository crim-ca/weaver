# Gitleaks v8 configuration, extending the default rules.
title = "gitleaks config"

[extend]
useDefault = true

[allowlist]
	description = "Allowlisted false-positives"
	commits = [
		# process ID containing secret as plain word
		'6927799b84fac00ec582dbd946031d6547c5a898',
		'ca1e0b0ac5ee9e0a676f7f29a14648688fcce9de',
		'b49611bca182a952b7a91c0f56f73433ce444a24',
	]
	paths = [
		'''tests/functional/test_workflow\.py''',
		'''weaver/wps_restapi/examples/vault_file_uploaded\.json''',
		'''.+\.js\.map$''',
	]
	regexes = [
		'''EchoSecrets''',
		'''WorkflowEchoSecrets''',
	]
